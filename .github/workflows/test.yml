name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Test and package
        run: xvfb-run -a mvn --batch-mode --no-transfer-progress clean test package

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: OpenGridSeg
          path: target/opengridseg-*.jar
