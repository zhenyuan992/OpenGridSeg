name: Feature request
description: Suggest an improvement to OpenGridSeg
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Explain the user need in plain words.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Suggested change
      description: Describe the workflow you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround
      description: Tell us how you handle this now, if applicable.
