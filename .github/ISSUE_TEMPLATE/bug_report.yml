name: Bug report
description: Report a reproducible problem in OpenGridSeg
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve OpenGridSeg. Do not upload private microscopy data without permission.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Tell us what you saw and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Give the smallest set of steps and an example filename pattern.
    validations:
      required: true
  - type: input
    id: fiji
    attributes:
      label: Fiji version
      placeholder: ImageJ2 and Java versions, if known
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows, macOS, or Linux and version
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error message or screenshot
      description: Remove private paths, names, and data before posting.
      render: shell
